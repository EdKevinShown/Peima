# =============================================================================
# EXAMPLE ONLY — staging-oriented compose with P7.6 env placeholders.
# Does NOT replace docker-compose.yml. Do not commit real secrets.
# Use managed Postgres in real staging; this file is for VM / local parity smoke.
# Runbook: docs/P7/P7.6-r9e4-staging-production-like-environment-bootstrap-runbook.md
# =============================================================================
# Usage (example):
#   cp docs/ops/peima-staging.env.example .env.staging
#   # Edit .env.staging — set DOCKER_DATABASE_URL if using embedded postgres
#   docker compose -f docker-compose.staging.example.yml --env-file .env.staging up -d
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: peima-staging-postgres-example
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-peima}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: peima-staging-api-example
    depends_on:
      - postgres
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Shanghai}
      API_PORT: ${API_PORT:-3000}
      API_HOST: ${API_HOST:-0.0.0.0}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://user:password@postgres:5432/peima?schema=public}
      JWT_SECRET: ${JWT_SECRET:-change-me-staging-example-only}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads/user-images}
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-http://localhost:3000}
      # P7.6 bootstrap freeze
      PEIMA_P76_READ_PATH_ENABLED: ${PEIMA_P76_READ_PATH_ENABLED:-0}
      PEIMA_P76_READ_PATH_VIEWER_IDS: ${PEIMA_P76_READ_PATH_VIEWER_IDS:-}
      PEIMA_P76_READ_PATH_SOURCE_VERSION: ${PEIMA_P76_READ_PATH_SOURCE_VERSION:-p7.6-r7j3-staging-cohort-v1}
      PEIMA_P76_READ_PATH_REQUIRE_PM_SIGNOFF: ${PEIMA_P76_READ_PATH_REQUIRE_PM_SIGNOFF:-1}
      PEIMA_P76_READ_PATH_REQUIRE_OPS_SIGNOFF: ${PEIMA_P76_READ_PATH_REQUIRE_OPS_SIGNOFF:-1}
      PEIMA_P76_READ_PATH_FALLBACK_LEGACY: ${PEIMA_P76_READ_PATH_FALLBACK_LEGACY:-1}
      PEIMA_P76_READ_PATH_STRICT_VIOLATION_BLOCK: ${PEIMA_P76_READ_PATH_STRICT_VIOLATION_BLOCK:-1}
      PEIMA_P76_PRODUCTION_PERCENT_ENABLED: ${PEIMA_P76_PRODUCTION_PERCENT_ENABLED:-0}
      PEIMA_P76_PRODUCTION_PERCENT: ${PEIMA_P76_PRODUCTION_PERCENT:-0}
      PEIMA_P76_PRODUCTION_KILL_SWITCH: ${PEIMA_P76_PRODUCTION_KILL_SWITCH:-1}
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
    volumes:
      - staging_uploads:/data/uploads/user-images
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    container_name: peima-staging-web-example
    depends_on:
      - api
    environment:
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-5174}:5173"
    restart: unless-stopped

  # Worker intentionally omitted — not required for P7.6 r9e3 reverify

volumes:
  staging_postgres_data:
  staging_uploads:
