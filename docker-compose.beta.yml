# =============================================================================
# Peima 内测部署（路线 B）：托管 Postgres + 本机 API / Worker / Web
# 无 postgres 服务。用法见 docs/ops/beta-au-ip-deploy.md
#
#   cp docs/ops/peima-beta.env.example .env
#   # 编辑 .env 后：
#   docker compose -f docker-compose.beta.yml build
#   docker compose -f docker-compose.beta.yml up -d
# =============================================================================

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: peima-beta-api
    env_file: .env
    environment:
      NODE_ENV: production
      API_PORT: ${API_PORT:-3000}
      API_HOST: ${API_HOST:-0.0.0.0}
      DATABASE_URL: ${DATABASE_URL}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads/user-images}
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
    volumes:
      - beta_uploads:/data/uploads/user-images
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: peima-beta-worker
    env_file: .env
    environment:
      # staging：内测 VPS 上允许 PEIMA_TEST_MATCH_RESULT_WRITER_* 写入 MatchResult（NODE_ENV=production 会整批 blocked）
      NODE_ENV: staging
      DATABASE_URL: ${DATABASE_URL}
      TZ: ${TZ:-Australia/Sydney}
      MATCH_CRON: ${MATCH_CRON:-0 */6 * * *}
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: peima-beta-web
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-5173}:5173"
    restart: unless-stopped

volumes:
  beta_uploads:
